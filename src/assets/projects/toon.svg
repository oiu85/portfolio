<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="bg" cx="0.25" cy="0.2" r="1">
      <stop offset="0" stop-color="#0e5f66"/>
      <stop offset="0.6" stop-color="#080a13"/>
      <stop offset="1" stop-color="#05060c"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- desktop window -->
  <g transform="translate(360 190)">
    <rect width="880" height="580" rx="28" fill="#0e1120" stroke="#35e0e0" stroke-opacity="0.35" stroke-width="2"/>
    <rect width="880" height="64" rx="28" fill="#141830"/>
    <circle cx="44" cy="32" r="9" fill="#ff6b9d"/>
    <circle cx="74" cy="32" r="9" fill="#ffc860"/>
    <circle cx="104" cy="32" r="9" fill="#b6f36a"/>
    <!-- JSON pane -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="24" fill="#8b93b4">
      <text x="48" y="134">{</text>
      <text x="80" y="176">"users": [</text>
      <text x="112" y="218">{ "id": 1,</text>
      <text x="112" y="260">  "name": "Ada" },</text>
      <text x="112" y="302">{ "id": 2,</text>
      <text x="112" y="344">  "name": "Lin" }</text>
      <text x="80" y="386">]</text>
      <text x="48" y="428">}</text>
    </g>
    <path d="M430 280h60m-20-20 20 20-20 20" stroke="#35e0e0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- TOON pane -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="24" fill="#35e0e0">
      <text x="530" y="218">users[2]{id,name}:</text>
      <text x="562" y="260">1,Ada</text>
      <text x="562" y="302">2,Lin</text>
    </g>
    <rect x="530" y="440" width="300" height="70" rx="35" fill="#35e0e0" fill-opacity="0.14" stroke="#35e0e0" stroke-opacity="0.5"/>
    <text x="680" y="484" text-anchor="middle" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#35e0e0">30% tokens</text>
  </g>

  <text x="80" y="920" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#eaedfb">TOON Converter</text>
</svg>
