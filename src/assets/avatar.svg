<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98bff"/>
      <stop offset="0.55" stop-color="#6c5cff"/>
      <stop offset="1" stop-color="#35e0e0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2150"/>
      <stop offset="1" stop-color="#0b0e1f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#6c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35e0e0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#35e0e0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b98bff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="190" r="190" fill="url(#halo)"/>

  <!-- shoulders -->
  <path d="M40 480c0-96 64-150 160-150s160 54 160 150z" fill="url(#body)"/>
  <path d="M40 480c0-96 64-150 160-150s160 54 160 150" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- neck -->
  <rect x="172" y="262" width="56" height="84" rx="24" fill="url(#skin)" opacity="0.85"/>

  <!-- head -->
  <ellipse cx="200" cy="196" rx="86" ry="100" fill="url(#skin)"/>
  <path d="M116 176c4-62 44-94 90-94 50 0 84 34 82 92-18-30-52-44-92-42-34 2-62 16-80 44z" fill="#141830" opacity="0.9"/>

  <!-- monogram -->
  <text x="200" y="424" text-anchor="middle" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="4" fill="#eaedfb" opacity="0.9">AA</text>
</svg>
